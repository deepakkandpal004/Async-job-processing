global:
  scrape_interval: 5s

scrape_configs:
  - job_name: "async-job-api"
    metrics_path: "/metrics"
    static_configs:
      - targets:
         - "host.docker.internal:3000"

  - job_name: "async-job-workers"
    metrics_path: "/metrics"
    static_configs:
      - targets:
         - "host.docker.internal:3001"
         - "host.docker.internal:3002"
